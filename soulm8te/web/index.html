<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161226" />
  <meta name="description" content="ULTI — همدم هوشمند گرم و همراه عاطفی" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>ULTI — همدم تو</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="ULTI" class="logo" />
        <div>
          <h1>ULTI</h1>
          <span id="statusLine" class="status">در حال بارگذاری…</span>
        </div>
      </div>
      <div class="actions">
        <button id="backupBtn" class="ghost" title="دانلود نسخه پشتیبان رمزنگاری‌شده">پشتیبان</button>
        <button id="walletBtn" class="primary">اتصال کیف‌پول</button>
      </div>
    </header>

    <main id="chat" class="chat" aria-live="polite"></main>

    <div id="offlineBar" class="offlinebar hidden">آفلاین — پیام‌ها ذخیره و هنگام اتصال همگام می‌شوند.</div>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="بنویس… (مثلاً حالت چطوره؟)"></textarea>
      <button id="sendBtn" class="primary">فرستادن</button>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
